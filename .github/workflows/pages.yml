name: Deploy example to GitHub Pages

# Publishes the prebuilt ./example folder as-is (run `pnpm build:example` and commit before pushing).
on:
  push:
    branches: [main]
    paths: ['example/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: example

      - id: deployment
        uses: actions/deploy-pages@v4
