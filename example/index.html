<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Web Viewer · Playground</title>
    <meta
      name="description"
      content="Ejemplo en vivo de pdf-web-viewer, un envoltorio ligero sobre el visor oficial de PDF.js."
    />
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --accent: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --surface: #151b23;
          --text: #e6edf3;
          --muted: #9198a1;
          --border: #3d444d;
          --accent: #4493f8;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        padding: 12px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0;
        font-size: 1.125rem;
      }
      header p {
        margin: 2px 0 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      nav {
        display: flex;
        gap: 16px;
        font-size: 0.875rem;
      }
      nav a {
        color: var(--accent);
        text-decoration: none;
      }
      nav a:hover {
        text-decoration: underline;
      }
      main {
        flex: 1;
        min-height: 0;
        padding: 16px;
      }
      .pdf-container {
        width: 100%;
        height: 100%;
        min-height: 480px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
    </style>
    <script src="lib/index.umd.js"></script>
    <script src="run.js"></script>
  </head>
  <body>
    <header>
      <div>
        <h1>📄 PDF Web Viewer</h1>
        <p>Un envoltorio ligero sobre el visor oficial de PDF.js.</p>
      </div>
      <nav>
        <a href="https://github.com/julioolivares/pdf-web-viewer">GitHub</a>
        <a href="https://www.npmjs.com/package/pdf-web-viewer">npm</a>
      </nav>
    </header>
    <main>
      <div class="pdf-container"></div>
    </main>
  </body>
</html>
