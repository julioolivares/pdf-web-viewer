<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pdf-web-viewer tests</title>
    <style>
      body {
        margin: 0;
        display: grid;
        grid-template-columns: repeat(3, 400px);
        gap: 16px;
        padding: 16px;
      }
      .viewer {
        height: 500px;
      }
    </style>
  </head>
  <body>
    <div id="viewer-a" class="viewer"></div>
    <div id="viewer-b" class="viewer"></div>
    <div id="viewer-c" class="viewer"></div>

    <script type="module">
      import { create } from '/dist/index.mjs'

      // Creates viewers from the tests and records their events, keyed by container id.
      window.testkit = {
        create,
        viewers: {},
        events: {},
        mount(id, file, options = {}) {
          const events = (this.events[id] = [])
          const viewer = create(file, {
            viewerPath: '/dist/web/viewer.html',
            ...options,
            onLoad: (info) => events.push({ type: 'load', ...info }),
            onPageChange: (info) => events.push({ type: 'page', ...info }),
            onError: (error) => events.push({ type: 'error', message: error.message }),
          })
          viewer.mount(document.getElementById(id))
          this.viewers[id] = viewer
          return viewer
        },
        // Fetches a PDF and returns it as `kind`, for the sources that cannot cross page.evaluate.
        async source(kind, path) {
          const blob = await (await fetch(path)).blob()
          const bytes = new Uint8Array(await blob.arrayBuffer())
          return {
            file: () => new File([blob], path.split('/').pop(), { type: 'application/pdf' }),
            blob: () => blob,
            arrayBuffer: () => bytes.buffer,
            uint8Array: () => bytes,
          }[kind]()
        },
      }
    </script>
  </body>
</html>
